name: codex-reviewed-cardnews
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1 previews; 0 publishes reviewed content'
        default: '1'
        type: choice
        options: ['1', '0']
permissions:
  contents: write
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The managed path publishes reviewed PNGs; fonts were used during local rendering.
      # Do not download 92MB of fonts before uploading already-rendered pages.
      - run: pip install pillow requests
      - run: python cardnews/managed.py
        env:
          CARD_KIND: nordic
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-cards
          path: cardnews/images/
          retention-days: 3
