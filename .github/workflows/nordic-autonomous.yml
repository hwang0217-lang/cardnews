name: Nordic PC-off autonomous production
run-name: Nordic autonomous ${{ inputs.mode || 'operate' }} ${{ inputs.format }}
on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preflight, draft-check, vision-probe, edit-verified-preview, review-existing-photo, preview, delivery-check, operate]
        default: preflight
      publish_now_date:
        description: One-time owner-authorized date; currently2026-11-08 only
        type: string
        required: false
      resume_draft_run:
        description: Proven pre-Canva failure only; current approved42474430889
        type: string
        required: false
      source_run:
        type: string
        required: false
      format:
        type: choice
        options: [carousel, reel, motion_reel]
        default: carousel
      plan_date:
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests Pillow imageio-ffmpeg
      - run: python cloud/autonomous_preflight.py
        if: inputs.mode == 'preflight' || inputs.mode == 'draft-check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python cloud/autonomous_draft_check.py
        if: inputs.mode == 'draft-check'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - run: python cloud/vision_probe.py
        if: inputs.mode == 'vision-probe'
        env:
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VISION_SOURCE_RUN: ${{ inputs.source_run }}
      - run: python cloud/edit_verified_preview.py
        if: inputs.mode == 'edit-verified-preview'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NORDIC_APPROVED_MUSIC: ${{ secrets.NORDIC_APPROVED_MUSIC }}
          NORDIC_MEDIA_UPLOAD_KEY: ${{ secrets.NORDIC_MEDIA_UPLOAD_KEY }}
          NORDIC_MEDIA_BASE: ${{ vars.NORDIC_MEDIA_BASE }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          VISION_SOURCE_RUN: ${{ inputs.source_run }}
      - name: Review existing real-photo design without regeneration or Instagram writes
        if: inputs.mode == 'review-existing-photo'
        run: python cloud/review_existing_photo.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NORDIC_APPROVED_MUSIC: ${{ secrets.NORDIC_APPROVED_MUSIC }}
          VISION_SOURCE_RUN: ${{ inputs.source_run }}
          NORDIC_PLAN_DATE: ${{ inputs.plan_date }}
      - name: Fresh design, visual QA, server editing and official delivery
        if: github.event_name == 'schedule' || inputs.mode == 'preview' || inputs.mode == 'delivery-check' || inputs.mode == 'operate'
        run: python cloud/autonomous.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          NORDIC_APPROVED_MUSIC: ${{ secrets.NORDIC_APPROVED_MUSIC }}
          NORDIC_MEDIA_UPLOAD_KEY: ${{ secrets.NORDIC_MEDIA_UPLOAD_KEY }}
          NORDIC_MEDIA_BASE: ${{ vars.NORDIC_MEDIA_BASE }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          NORDIC_AUTONOMOUS_ACTIVE: ${{ vars.NORDIC_AUTONOMOUS_ACTIVE || '0' }}
          NORDIC_RESUME_DRAFT_RUN: ${{ inputs.resume_draft_run }}
          NORDIC_PUBLISH_NOW_DATE: ${{ inputs.publish_now_date }}
          NORDIC_MODE: ${{ inputs.mode || 'operate' }}
          NORDIC_PREVIEW_FORMAT: ${{ inputs.format || 'carousel' }}
          NORDIC_PLAN_DATE: ${{ inputs.plan_date }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordic-autonomous-report
          path: |
            cloud-reports/autonomous-*.json
            cloud-reports/connection.json
            cloud-reports/page-*.png
            cloud-reports/scene-*.png
          retention-days: 7
