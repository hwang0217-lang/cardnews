name: Nordic Canva cloud Reel delivery
run-name: Nordic cloud ${{ inputs.mode }} ${{ inputs.gateway_run_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [export-check, delivery-check, publish]
        default: export-check
      gateway_run_id:
        required: true
        type: string
      gateway_request_id:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python cloud/cloud_reel.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_PAT: ${{ secrets.GH_PAT }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          CLOUD_REEL_MODE: ${{ inputs.mode }}
          CANVA_GATEWAY_RUN_ID: ${{ inputs.gateway_run_id }}
          CANVA_GATEWAY_REQUEST_ID: ${{ inputs.gateway_request_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordic-cloud-connection
          path: |
            cloud-reports/connection.json
            cloud-reports/scene-*.png
          retention-days: 3
