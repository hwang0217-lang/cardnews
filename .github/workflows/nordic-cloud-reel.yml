name: Nordic Canva cloud Reel delivery
run-name: Nordic cloud ${{ inputs.mode }} ${{ inputs.gateway_run_id }}
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        options: [export-check, delivery-check, publish]
        default: export-check
      plan_path:
        description: Saved plan path; blank selects today KST cloud/plans/YYYY-MM-DD.json
        required: false
        type: string
      gateway_run_id:
        description: Optional existing gateway receipt; leave both references empty for cloud orchestration
        required: false
        type: string
      gateway_request_id:
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests imageio-ffmpeg Pillow
      - run: python cloud/cloud_reel.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANVA_GATEWAY_GH_TOKEN: ${{ secrets.CANVA_GATEWAY_GH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLISH_PAUSED: ${{ vars.CODEX_PUBLISH_PAUSED || '1' }}
          CLOUD_PLAN_PATH: ${{ inputs.plan_path }}
          CLOUD_REEL_MODE: ${{ inputs.mode }}
          CANVA_GATEWAY_RUN_ID: ${{ inputs.gateway_run_id }}
          CANVA_GATEWAY_REQUEST_ID: ${{ inputs.gateway_request_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nordic-cloud-connection
          path: |
            cloud-reports/connection.json
            cloud-reports/scene-*.png
            cloud-reports/page-*.png
          retention-days: 3
