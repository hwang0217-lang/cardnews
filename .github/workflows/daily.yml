name: daily-cardnews

on:
  schedule:
    # 정각(0분)은 GitHub가 몰려서 몇 시간씩 밀리기 쉬워서, 일부러 어긋난 분에 걸어요.
    # 한국시간 매일 오전 7시 47분 = UTC 전날 22시 47분 (지연을 감안해 조금 일찍)
    - cron: "47 22 * * *"
    # 한국시간 매일 오후 6시 47분 = UTC 오전 9시 47분
    - cron: "47 9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1이면 글/이미지만 만들고 업로드는 안 해요"
        default: "0"

permissions:
  contents: write

concurrency:
  group: kitchen-cardnews
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 한글 글꼴 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - name: 라이브러리 설치
        run: pip install -r cardnews/requirements.txt
      - name: 카드뉴스 만들고 올리기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python cardnews/main.py
      - name: 연습 실행 이미지 보관 (내려받아 확인용)
        if: ${{ github.event.inputs.dry_run == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: cardnews-preview
          path: cardnews/images
          retention-days: 3
          if-no-files-found: ignore
      - name: 발행 기록 저장
        if: ${{ always() }}
        run: |
          git config user.name 'cardnews-bot'
          git config user.email 'cardnews-bot@users.noreply.github.com'
          if [ -f cardnews/state.json ]; then
            git add cardnews/state.json
            git diff --cached --quiet || (git commit -m 'update state' && git push)
          fi
