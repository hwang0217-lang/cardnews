name: Nordic Threads shopping server
run-name: Threads shopping ${{ inputs.mode || (github.event.schedule == '45 21 * * *' && 'generate' || github.event.schedule == '10 23 * * *' && 'generate' || 'monitor') }}
on:
  schedule:
    - cron: '45 21 * * *'
    - cron: '10 23 * * *'
    - cron: '20 0,3,6 * * *'
    - cron: '25 23,2,5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [generate, validate, monitor]
        default: monitor
      target_date:
        type: string
        required: false
      target_slot:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: nordic-threads-shopping-generation
  cancel-in-progress: false
jobs:
  shopping:
    if: vars.THREADS_SHOPPING_SERVER_ACTIVE == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate the verified shopping photo post for the server queue
        if: inputs.mode == 'generate' || github.event.schedule == '45 21 * * *' || github.event.schedule == '10 23 * * *'
        run: node threads-shopping/generate.mjs
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_SHOPPING_COUPANG_ACCESS: ${{ secrets.THREADS_SHOPPING_COUPANG_ACCESS }}
          THREADS_SHOPPING_COUPANG_SECRET: ${{ secrets.THREADS_SHOPPING_COUPANG_SECRET }}
          THREADS_SHOPPING_ADMIN_KEY: ${{ secrets.THREADS_SHOPPING_ADMIN_KEY }}
      - name: Generate link-free information posts for the server queue
        if: ${{ !cancelled() && (inputs.mode == 'generate' || github.event.schedule == '45 21 * * *' || github.event.schedule == '10 23 * * *') }}
        run: node threads-shopping/generate-info.mjs
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_SHOPPING_ADMIN_KEY: ${{ secrets.THREADS_SHOPPING_ADMIN_KEY }}
      - name: Recheck the exact product option and original source before publishing
        if: inputs.mode == 'validate' || github.event.schedule == '25 23,2,5 * * *'
        run: node threads-shopping/validate.mjs
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          THREADS_SHOPPING_COUPANG_ACCESS: ${{ secrets.THREADS_SHOPPING_COUPANG_ACCESS }}
          THREADS_SHOPPING_COUPANG_SECRET: ${{ secrets.THREADS_SHOPPING_COUPANG_SECRET }}
          THREADS_SHOPPING_ADMIN_KEY: ${{ secrets.THREADS_SHOPPING_ADMIN_KEY }}
      - name: Verify the clock and due publications without publishing
        if: inputs.mode == 'monitor' || github.event.schedule == '20 0,3,6 * * *'
        run: node threads-shopping/monitor.mjs
        env:
          THREADS_SHOPPING_ADMIN_KEY: ${{ secrets.THREADS_SHOPPING_ADMIN_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: threads-shopping-report
          path: threads-reports/*.json
          if-no-files-found: ignore
          retention-days: 7
