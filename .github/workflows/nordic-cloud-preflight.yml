name: Nordic read-only cloud connection preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codex-reviewed-publishing
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python cloud/instagram_preflight.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
