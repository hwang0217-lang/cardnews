name: refresh-instagram-token

on:
  schedule:
    # 매주 일요일 새벽 3시 13분(한국시간) = UTC 토요일 18시 13분
    - cron: "13 18 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 라이브러리 설치
        run: pip install requests
      - name: 토큰 갱신하고 비밀 저장칸에 저장
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          NEW_TOKEN="$(python cardnews/refresh_token.py)"
          echo "::add-mask::$NEW_TOKEN"
          # 갱신이 같은 문자열의 유효기간만 늘렸으면 저장할 것이 없다(GH_PAT 불필요)
          if [ "$NEW_TOKEN" = "$IG_ACCESS_TOKEN" ]; then
            echo "같은 토큰의 유효기간이 연장됐어요. 저장할 새 값이 없어요."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "새 토큰 값이 나왔는데 GH_PAT 비밀 값이 없어요." >&2
            exit 1
          fi
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN" --repo "$GITHUB_REPOSITORY"
          echo "IG_ACCESS_TOKEN을 새 값으로 저장했어요."
